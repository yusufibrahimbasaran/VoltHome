services:
  postgres:
    image: postgres:15-alpine
    container_name: volthome-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: volthome
      POSTGRES_PASSWORD: volthome_pass
      POSTGRES_DB: volthome_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: volthome-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: volthome-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  ignite:
    image: apacheignite/ignite:2.16.0
    container_name: volthome-ignite
    ports:
      - "10800:10800"
      - "18080:8080"
    environment:
      - IGNITE_QUIET=false

  volthome-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: volthome-core-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=volthome_db
      - DB_USER=volthome
      - DB_PASSWORD=volthome_pass
      - KAFKA_SERVERS=kafka:29092
      - IGNITE_ADDRESSES=ignite:10800
      - GEMINI_API_KEY=""
    depends_on:
      - postgres
      - kafka
      - ignite

  volthome-sensors:
    build:
      context: ./telemetry-sensors
      dockerfile: Dockerfile
    container_name: volthome-sensors-app
    restart: always
    environment:
      - KAFKA_SERVERS=kafka:29092
    depends_on:
      - kafka
